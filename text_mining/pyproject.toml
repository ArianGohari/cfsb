[project]
name = "litmine"
version = "0.1.0"
description = "Evidence-grounded literature mining with reproducible graph exports"
requires-python = ">=3.11"
dependencies = ["pyarrow==25.0.1", "real-ladybug==0.15.3", "snakemake==9.26.1"]

[project.scripts]
litmine = "litmine.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litmine"]
